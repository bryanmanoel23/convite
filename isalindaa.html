<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite</title>
<style>
    
body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    overflow:hidden;

    background-image:url('./Isal.PNG');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
    
.caixa{
    position:relative;

    padding:60px 40px;
    border-radius:35px;
    text-align:center;

    width:90%;
    max-width:450px;

    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    overflow:visible;
}

.caixa::before{
    content:"";
    position:absolute;
    inset:0;

    border-radius:35px;
    padding:3px;

    background:linear-gradient(
        45deg,
        #ff0080,
        #7928ca,
        #00d4ff,
        #39ff14,
        #ff0080
    );

    background-size:300% 300%;

    animation:borda 5s linear infinite;

    z-index:0;
}
    
.caixa::after{
    content:"";
    position:absolute;
    inset:3px;

    background:rgba(0,0,0,0.45);
    border-radius:32px;

    z-index:1;
}

.caixa > *{
    position:relative;
    z-index:2;
}

@keyframes borda{
    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}

h2{
    font-size:42px;
    line-height:1.2;
    margin-bottom:40px;
    color:white;
}

button{
    padding:20px 38px;
    border:none;
    border-radius:18px;
    font-size:26px;
    margin:15px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
}
    
</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>
    <button class="sim" onclick="alert('Só marcar o horário 😌')">Sim</button>
    <button class="nao" id="nao">Não</button>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("touchstart", fugir);
btn.addEventListener("mouseover", fugir);
btn.addEventListener("click", fugir);

let ativado = false;

function fugir(){

    if(!ativado){
        btn.style.position = "fixed";
        btn.style.zIndex = "9999";
        ativado = true;
    }

    const largura = window.innerWidth - btn.offsetWidth - 10;
    const altura = window.innerHeight - btn.offsetHeight - 10;

    const x = Math.random() * largura;
    const y = Math.random() * altura;

    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}
    
</script>

</body>
</html>
