<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite</title>
<style>
body{
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}

.caixa{
    background:white;
    padding:50px 40px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    width:85%;
    max-width:420px;
}

h2{
    font-size:32px;
    margin-bottom:30px;
    color:#111;
}

button{
    padding:16px 32px;
    border:none;
    border-radius:16px;
    font-size:22px;
    margin:12px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>
    <button class="sim" onclick="alert('Sabia 😌')">Sim</button>
    <button class="nao" id="nao">Não</button>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("touchstart", fugir);
btn.addEventListener("mouseover", fugir);

function fugir(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}
</script>

</body>
</html>
