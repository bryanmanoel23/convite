<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite</title>
<style>
body{
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    position:relative;
    overflow:hidden;

    background-image: url('Isal.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.20);
    z-index:0;
}

.caixa{
    position:relative;
    z-index:1;

    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);

    padding:70px 50px;
    border-radius:35px;
    text-align:center;

    width:90%;
    max-width:500px;

    overflow:hidden;
}
.caixa::before{
    content:"";
    position:absolute;
    inset:-4px;

    background:linear-gradient(
        90deg,
        #ff0080,
        #7928ca,
        #00d4ff,
        #39ff14,
        #ff0080
    );

    background-size:300%;
    border-radius:40px;

    animation:girar 6s linear infinite;

    z-index:-2;
}

.caixa::after{
    content:"";
    position:absolute;
    inset:4px;

    background:rgba(255,255,255,0.10);
    backdrop-filter: blur(10px);

    border-radius:32px;

    z-index:-1;
}

@keyframes girar{
    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}
    
h2{
    font-size:42px;
    line-height:1.2;
    margin-bottom:40px;
    color:white;
}

button{
    padding:20px 38px;
    border:none;
    border-radius:18px;
    font-size:26px;
    margin:15px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>
    <button class="sim" onclick="alert('Sabia 😌')">Sim</button>
    <button class="nao" id="nao">Não</button>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("touchstart", fugir);
btn.addEventListener("mouseover", fugir);

function fugir(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}
</script>

</body>
</html>
