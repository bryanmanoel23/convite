<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite</title>
<style>
body{
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    background-image: url('Isal.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:0;
}

.caixa{
    position:relative;
    z-index:1;

    background:rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);

    padding:70px 50px;
    border-radius:35px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,0.25);
    width:90%;
    max-width:500px;
}

h2{
    font-size:42px;
    line-height:1.2;
    margin-bottom:40px;
    color:#111;
}

button{
    padding:20px 38px;
    border:none;
    border-radius:18px;
    font-size:26px;
    margin:15px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>
    <button class="sim" onclick="alert('Sabia 😌')">Sim</button>
    <button class="nao" id="nao">Não</button>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("touchstart", fugir);
btn.addEventListener("mouseover", fugir);

function fugir(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}
</script>

</body>
</html>
