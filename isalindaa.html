<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite</title>
<style>
body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    overflow:hidden;

    background-image:url('Isal.PNG');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.caixa{
    position:relative;

    padding:70px 50px;
    border-radius:35px;
    text-align:center;

    width:90%;
    max-width:500px;

    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);

    overflow:hidden;
}

.caixa::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;

    background:conic-gradient(
        #ff0080,
        #7928ca,
        #00d4ff,
        #39ff14,
        #ff0080
    );

    animation:girar 4s linear infinite;

    z-index:0;
}

.caixa::after{
    content:"";
    position:absolute;
    inset:4px;

    background:rgba(15,15,15,0.75);
    border-radius:32px;

    z-index:1;
}

.caixa > *{
    position:relative;
    z-index:2;
}

@keyframes girar{
    100%{
        transform:rotate(360deg);
    }
}

h2{
    font-size:42px;
    line-height:1.2;
    margin-bottom:40px;
    color:white;
}

button{
    padding:20px 38px;
    border:none;
    border-radius:18px;
    font-size:26px;
    margin:15px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>
    <button class="sim" onclick="alert('Só marcar o horário 😌')">Sim</button>
    <button class="nao" id="nao">Não</button>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("touchstart", fugir);
btn.addEventListener("mouseover", fugir);

function fugir(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}
</script>

</body>
</html>
